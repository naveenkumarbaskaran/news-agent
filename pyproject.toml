[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-agent-ai"
version = "0.1.0"
description = "AI-powered news monitoring agent: track topics, detect signals, generate daily briefings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["news", "ai", "agent", "anthropic", "claude", "rss", "briefing"]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "rich>=13.0",
    "feedparser>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
news-agent = "news_agent.cli:main"

[project.urls]
Homepage = "https://github.com/example/news-agent-ai"
Issues = "https://github.com/example/news-agent-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["news_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
